name: .NET CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore DocumentManagement.slnx

      - name: Build solution
        run: dotnet build DocumentManagement.slnx --no-restore

      - name: Run automated tests
        run: dotnet test DocumentManagement.slnx --no-build --no-restore
